server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with cache headers
    location ~* \.(wasm|js|css|png|jpg|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy API requests to the backend
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend "http://backend-api:8080";
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — all unknown paths serve index.html so yew-router
    # can handle client-side navigation (e.g. direct access to /requisitions)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
