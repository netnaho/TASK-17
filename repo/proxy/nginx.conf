worker_processes  1;
events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  upstream silveroak_api { server backend-api:8080; }
  upstream silveroak_web { server frontend:80; }

  server {
    listen 80;
    server_name _;

    location /api/ {
      proxy_pass http://silveroak_api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://silveroak_web;
      proxy_set_header Host $host;
    }
  }
}
